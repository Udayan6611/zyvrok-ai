<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Zyvrok - Authentication & Profile</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "background": "#f8f9ff",
            "on-background": "#0b1c30",
            "surface": "#f8f9ff",
            "surface-container": "#e5eeff",
            "surface-container-low": "#eff4ff",
            "surface-container-high": "#dce9ff",
            "surface-container-lowest": "#ffffff",
            "primary": "#6b38d4",
            "primary-container": "#8455ef",
            "on-primary": "#ffffff",
            "on-primary-container": "#fffbff",
            "secondary": "#565e74",
            "secondary-container": "#dae2fd",
            "on-surface-variant": "#494454",
            "outline-variant": "#cbc3d7"
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
            heading: ["Space Grotesk", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    }
  </script>
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(203, 195, 215, 0.5);
      box-shadow: 0 10px 30px -10px rgba(107, 56, 212, 0.1);
    }
  </style>
</head>
<body class="bg-background text-on-background font-sans min-h-screen flex items-center justify-center p-4 selection:bg-primary-container selection:text-on-primary-container">

  <div class="max-w-md w-full glass-card rounded-3xl p-8 space-y-6">
    <div class="text-center space-y-2">
      <a href="../index.html" class="inline-flex items-center justify-center h-12 w-12 rounded-2xl bg-gradient-to-tr from-primary to-primary-container text-white shadow-lg shadow-primary/25 mb-2">
        <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">graphic_eq</span>
      </a>
      <h2 class="font-heading text-2xl font-bold text-on-background">Welcome to Zyvrok</h2>
      <p class="text-xs text-secondary">Sign in or create an account to sync your credits and library across devices.</p>
    </div>

    <form id="auth-form" class="space-y-4">
      <div>
        <label for="email" class="block text-xs font-bold font-mono text-secondary uppercase mb-1">Email Address</label>
        <input type="email" id="email" required placeholder="creator@example.com" class="w-full px-4 py-3 bg-surface-container-low/80 border border-outline-variant/50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-primary focus:bg-white transition-all"/>
      </div>

      <div>
        <label for="password" class="block text-xs font-bold font-mono text-secondary uppercase mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 bg-surface-container-low/80 border border-outline-variant/50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-primary focus:bg-white transition-all"/>
      </div>

      <div class="flex gap-3 pt-2">
        <button type="button" id="btn-login" class="flex-1 py-3 bg-primary hover:bg-primary-container text-white font-semibold text-xs rounded-xl shadow-md transition-all active:scale-95">
          Sign In
        </button>
        <button type="button" id="btn-signup" class="flex-1 py-3 bg-surface-container-high hover:bg-surface-container-highest text-on-surface font-semibold text-xs rounded-xl border border-outline-variant/40 transition-all active:scale-95">
          Create Account
        </button>
      </div>

      <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-outline-variant/30"></div>
        <span class="flex-shrink mx-3 text-xs font-mono text-secondary">OR</span>
        <div class="flex-grow border-t border-outline-variant/30"></div>
      </div>

      <button type="button" id="btn-demo" class="w-full py-3 bg-surface-container-lowest border border-outline-variant/60 text-secondary hover:text-primary text-xs font-semibold rounded-xl transition-all">
        Continue in Demo Mode (50 Credits)
      </button>
    </form>

    <div class="text-center">
      <a href="../repurpose_studio_responsive/code.html" class="text-xs text-primary hover:underline font-semibold">
        ← Back to Repurpose Studio
      </a>
    </div>
  </div>

  <script type="module">
    import { supabase } from '../src/lib/supabase.js';

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    document.getElementById('btn-login').addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      if (!email || !password) {
        alert('Please enter your email and password.');
        return;
      }
      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        alert('Signed in successfully! Redirecting to Studio...');
        window.location.href = '../repurpose_studio_responsive/code.html';
      } catch (err) {
        alert(err.message || 'Login error');
      }
    });

    document.getElementById('btn-signup').addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      if (!email || !password) {
        alert('Please enter your email and password.');
        return;
      }
      try {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        alert('Account created! Please check your email for confirmation or proceed to Studio.');
        window.location.href = '../repurpose_studio_responsive/code.html';
      } catch (err) {
        alert(err.message || 'Signup error');
      }
    });

    document.getElementById('btn-demo').addEventListener('click', () => {
      window.location.href = '../repurpose_studio_responsive/code.html';
    });
  </script>
</body>
</html>
