<!DOCTYPE html>
<html class="h-full" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>PostMorph AI - Saved Posts History</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "background": "#f8f9ff",
            "on-background": "#0b1c30",
            "surface": "#f8f9ff",
            "surface-container": "#e5eeff",
            "surface-container-low": "#eff4ff",
            "surface-container-high": "#dce9ff",
            "surface-container-lowest": "#ffffff",
            "primary": "#6b38d4",
            "primary-container": "#8455ef",
            "on-primary": "#ffffff",
            "on-primary-container": "#fffbff",
            "secondary": "#565e74",
            "secondary-container": "#dae2fd",
            "on-surface-variant": "#494454",
            "outline-variant": "#cbc3d7"
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
            heading: ["Space Grotesk", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    }
  </script>
  <style>
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(203, 195, 215, 0.5);
    }
  </style>
</head>
<body class="bg-background text-on-background font-sans h-full flex overflow-hidden antialiased selection:bg-primary-container selection:text-on-primary-container">

  <!-- Desktop SideNav -->
  <aside class="hidden md:flex flex-col h-full w-[280px] bg-surface shadow-xl fixed inset-y-0 left-0 z-[60] p-4 border-r border-outline-variant/30">
    <a href="../landing_page_responsive/code.html" class="flex items-center gap-3 px-4 py-4 mb-6 group cursor-pointer">
      <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-primary to-primary-container flex items-center justify-center text-white shadow-md transition-transform group-hover:scale-105">
        <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">graphic_eq</span>
      </div>
      <span class="font-heading text-xl font-bold text-primary">PostMorph AI</span>
    </a>

    <ul class="space-y-2">
      <li>
        <a class="flex items-center gap-3 px-4 py-3 rounded-xl text-on-surface-variant hover:bg-surface-container-high transition-colors text-sm font-medium" href="../landing_page_responsive/code.html">
          <span class="material-symbols-outlined">home</span>
          <span>Home</span>
        </a>
      </li>
      <li>
        <a class="flex items-center gap-3 px-4 py-3 rounded-xl text-on-surface-variant hover:bg-surface-container-high transition-colors text-sm font-medium" href="../repurpose_studio_responsive/code.html">
          <span class="material-symbols-outlined">dashboard</span>
          <span>Studio</span>
        </a>
      </li>
      <li>
        <a class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primary-container text-on-primary-container font-semibold text-sm shadow-sm" href="code.html">
          <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">history</span>
          <span>History</span>
        </a>
      </li>
      <li>
        <a class="flex items-center gap-3 px-4 py-3 rounded-xl text-on-surface-variant hover:bg-surface-container-high transition-colors text-sm font-medium" href="../upgrade_to_pro_responsive/code.html">
          <span class="material-symbols-outlined">payments</span>
          <span>Pricing & Pro Pack</span>
        </a>
      </li>
      <li>
        <a id="history-nav-account" class="flex items-center gap-3 px-4 py-3 rounded-xl text-on-surface-variant hover:bg-surface-container-high transition-colors text-sm font-medium" href="../login_sign_up_responsive/code.html">
          <span class="material-symbols-outlined">account_circle</span>
          <span id="history-account-name">Account</span>
        </a>
      </li>
    </ul>

    <!-- Bottom Credits Info -->
    <div class="mt-auto flex flex-col gap-3 border-t border-outline-variant/20 pt-4">
      <div class="flex items-center justify-between px-4 py-3 bg-surface-container-lowest rounded-xl border border-outline-variant/30 shadow-sm">
        <div class="flex items-center gap-2 text-on-surface-variant font-mono text-xs">
          <span class="material-symbols-outlined text-amber-500 text-sm" style="font-variation-settings: 'FILL' 1;">token</span>
          <span>Credits: <strong id="history-sidebar-credits" class="text-primary font-bold">...</strong></span>
        </div>
      </div>
      <a href="../upgrade_to_pro_responsive/code.html" class="flex items-center justify-center gap-2 px-4 py-3 bg-primary text-white rounded-xl font-semibold text-sm shadow-md hover:bg-primary-container transition-all">
        <span class="material-symbols-outlined text-sm">bolt</span>
        <span>Upgrade to Pro</span>
      </a>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 ml-0 md:ml-[280px] h-full overflow-y-auto p-4 md:p-8">
    <div class="max-w-6xl mx-auto space-y-6 pt-16 md:pt-0">
      
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-outline-variant/20 pb-4">
        <div>
          <h1 class="font-heading text-2xl sm:text-3xl font-bold text-on-background">Saved Posts History</h1>
          <p class="text-xs sm:text-sm text-secondary mt-1">Review, re-copy, or inspect your previously generated content.</p>
        </div>
        <a href="../repurpose_studio_responsive/code.html" class="px-4 py-2 bg-primary hover:bg-primary-container text-white text-xs font-semibold rounded-xl flex items-center gap-1.5 shadow-sm transition-all self-start">
          <span class="material-symbols-outlined text-sm">add</span>
          <span>New Morph</span>
        </a>
      </div>

      <!-- History Content List Container -->
      <div id="history-container" class="space-y-4">
        <div class="p-8 text-center text-xs text-secondary font-mono">Loading saved posts...</div>
      </div>
    </div>
  </main>

  <script type="module">
    import { supabase, getCurrentUser, getEffectiveCredits } from '../src/lib/supabase.js';

    const historyContainer = document.getElementById('history-container');
    const creditsLabel = document.getElementById('history-sidebar-credits');
    const accountName = document.getElementById('history-account-name');

    window.copySnippet = function(text, label) {
      navigator.clipboard.writeText(text);
      alert(`Copied ${label} to clipboard!`);
    };

    window.addEventListener('pm_credits_updated', (e) => {
      if (typeof e.detail?.credits === 'number' && creditsLabel) {
        creditsLabel.textContent = e.detail.credits;
      }
    });

    window.addEventListener('storage', async (e) => {
      if (e.key && (e.key.startsWith('pm_credits') || e.key.includes('guest_credits') || e.key.includes('paid'))) {
        const user = await getCurrentUser();
        const credits = await getEffectiveCredits(user?.id);
        if (creditsLabel) creditsLabel.textContent = credits;
      }
    });

    window.addEventListener('focus', async () => {
      const user = await getCurrentUser();
      const credits = await getEffectiveCredits(user?.id);
      if (creditsLabel) creditsLabel.textContent = credits;
    });

    async function loadHistory() {
      try {
        const user = await getCurrentUser();
        const credits = await getEffectiveCredits(user?.id);
        if (creditsLabel) creditsLabel.textContent = credits;

        if (user && accountName) {
          accountName.textContent = user.email.split('@')[0];
        }

        if (!user?.id) {
          historyContainer.innerHTML = `
            <div class="glass-panel rounded-2xl p-8 text-center space-y-3">
              <span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">cloud_off</span>
              <h3 class="font-heading text-base font-bold text-on-background">Viewing in Guest Mode</h3>
              <p class="text-xs text-secondary max-w-md mx-auto">
                Sign in to save your history permanently to the cloud and access your generated posts from any device.
              </p>
              <a href="../login_sign_up_responsive/code.html" class="inline-block px-5 py-2.5 bg-primary text-white text-xs font-semibold rounded-xl shadow-sm hover:bg-primary-container transition-all">
                Sign In or Create Free Account
              </a>
            </div>
          `;
          return;
        }

        const { data: posts, error } = await supabase
          .from('repurposed_posts')
          .select('*')
          .eq('user_id', user.id)
          .order('created_at', { ascending: false });

        if (error || !posts || posts.length === 0) {
          historyContainer.innerHTML = `
            <div class="glass-panel rounded-2xl p-8 text-center space-y-3">
              <span class="material-symbols-outlined text-4xl text-secondary">history_toggle_off</span>
              <h3 class="font-heading text-base font-bold text-on-background">No Saved Posts Yet</h3>
              <p class="text-xs text-secondary">You haven't generated any posts yet. Head to the Studio to morph your first link or text!</p>
              <a href="../repurpose_studio_responsive/code.html" class="inline-block px-5 py-2.5 bg-primary text-white text-xs font-semibold rounded-xl shadow-sm hover:bg-primary-container transition-all">
                Open Repurpose Studio
              </a>
            </div>
          `;
          return;
        }

        historyContainer.innerHTML = posts.map(post => {
          const twitterContent = Array.isArray(post.twitter_thread) 
            ? post.twitter_thread.join('\n\n') 
            : (post.twitter_thread || '');
          const escapedLinkedin = (post.linkedin_post || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
          const escapedTwitter = twitterContent.replace(/'/g, "\\'").replace(/"/g, '&quot;');
          const escapedNewsletter = (post.newsletter_blurb || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');

          return `
            <div class="glass-panel rounded-2xl p-6 space-y-4 shadow-sm hover:border-primary/40 transition-all">
              <div class="flex items-center justify-between flex-wrap gap-2">
                <div class="flex items-center gap-2">
                  <span class="px-2.5 py-1 rounded-lg bg-primary/10 text-primary font-mono text-xs font-semibold uppercase">${post.input_type || 'text'}</span>
                  <span class="px-2.5 py-1 rounded-lg bg-surface-container-high text-secondary font-mono text-xs">Tone: ${post.tone || 'professional'}</span>
                </div>
                <span class="text-xs font-mono text-secondary">${new Date(post.created_at || Date.now()).toLocaleDateString()}</span>
              </div>

              <div>
                <h4 class="text-xs font-bold font-mono text-secondary uppercase mb-1">Source Excerpt</h4>
                <p class="text-sm text-on-surface line-clamp-2 bg-surface-container-low p-3 rounded-xl border border-outline-variant/30">
                  "${post.original_snippet || 'Source content'}"
                </p>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-3 gap-3 pt-2">
                <button onclick="window.copySnippet('${escapedLinkedin}', 'LinkedIn Post')" class="p-3 bg-white hover:bg-surface-container-low border border-outline-variant/40 rounded-xl text-left text-xs space-y-1 transition-all">
                  <div class="flex items-center justify-between font-bold text-primary">
                    <span>LinkedIn Post</span>
                    <span class="material-symbols-outlined text-sm">content_copy</span>
                  </div>
                  <p class="text-secondary line-clamp-2">${post.linkedin_post || 'Empty'}</p>
                </button>

                <button onclick="window.copySnippet('${escapedTwitter}', 'Twitter Thread')" class="p-3 bg-white hover:bg-surface-container-low border border-outline-variant/40 rounded-xl text-left text-xs space-y-1 transition-all">
                  <div class="flex items-center justify-between font-bold text-purple-600">
                    <span>Twitter Thread</span>
                    <span class="material-symbols-outlined text-sm">content_copy</span>
                  </div>
                  <p class="text-secondary line-clamp-2">${twitterContent || 'Empty'}</p>
                </button>

                <button onclick="window.copySnippet('${escapedNewsletter}', 'Newsletter Snippet')" class="p-3 bg-white hover:bg-surface-container-low border border-outline-variant/40 rounded-xl text-left text-xs space-y-1 transition-all">
                  <div class="flex items-center justify-between font-bold text-pink-600">
                    <span>Newsletter Snippet</span>
                    <span class="material-symbols-outlined text-sm">content_copy</span>
                  </div>
                  <p class="text-secondary line-clamp-2">${post.newsletter_blurb || 'Empty'}</p>
                </button>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.warn('History fetch error:', err);
      }
    }

    loadHistory();
  </script>
</body>
</html>
